[project]
name = "ncert-rag"
version = "1.0.0"
readme = "README.md"
description = "A complete RAG pipeline for NCERT books"
requires-python = ">=3.14"
dependencies = [
    "ncert-cli>=1.0.1",
    "pydantic-ai>=2.33.0",
    "pymupdf>=1.28.2",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.14"]

[project.scripts]
ncert-rag = "ncert_rag.main:main"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# lets `python3 -m pytest` work in a bare checkout, without a synced venv
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
